services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_backend
      POSTGRES_USER: ai_backend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ai_backend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_backend -d ai_backend"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://ai_backend:${POSTGRES_PASSWORD}@db:5432/ai_backend
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  ai_backend_postgres:
